name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, build, audits, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Lighthouse flags canonical URLs on another domain, so CI builds canonicals for localhost.
      # Vercel builds use the real NEXT_PUBLIC_SITE_URL (or the default in src/lib/site.ts).
      NEXT_PUBLIC_SITE_URL: http://localhost
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (static export to out/)
        run: pnpm build

      - name: Banned terms audit
        run: pnpm audit:terms

      - name: Number and evidence audit
        run: pnpm audit:facts

      - name: Internal link check
        run: pnpm check:links

      - name: Lighthouse CI
        run: pnpm dlx @lhci/cli@0.15.1 autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
          retention-days: 14
